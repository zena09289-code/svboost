<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S&V BOOST — Напитки</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    width: 100%;
    max-width: 100%;
    overflow-x: hidden;
}

body {
    width: 100%;
    max-width: 100%;
    padding-top: 72px;
    font-family: Arial, Helvetica, sans-serif;
    background: #0a0d12;
    color: #f5f7fb;
    overflow-x: hidden;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

/* ================= HEADER ================= */

header {
    height: 72px;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    z-index: 100;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 5%;

    background: rgba(10,13,18,.94);
    backdrop-filter: blur(18px);

    border-bottom: 1px solid #252b36;
}

.logo {
    font-size: 25px;
    font-weight: 900;
    letter-spacing: -1px;
}

.logo span {
    color: #7168ff;
}

.cart-button {
    display: flex;
    align-items: center;
    gap: 10px;

    border: 1px solid #303744;
    background: #181d26;
    color: #fff;

    padding: 10px 15px;

    border-radius: 12px;

    font-weight: 800;

    cursor: pointer;

    transition: .2s;
}

.cart-button:hover {
    background: #222833;
}

.cart-count {
    width: 25px;
    height: 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: #7168ff;

    font-size: 12px;
}

/* ================= HERO ================= */

.hero {
    padding: 90px 20px;

    text-align: center;

    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(113,104,255,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(113,104,255,.12),
            transparent 32%
        );
}

.hero h1 {
    font-size: clamp(45px, 7vw, 75px);
    font-weight: 950;

    letter-spacing: -4px;

    margin-bottom: 20px;

    background: linear-gradient(
        135deg,
        #fff,
        #9690ff
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.hero p {
    color: #858e9e;
    font-size: 17px;
}

/* ================= CATALOG ================= */

.container {
    max-width: 1250px;
    margin: auto;
    padding: 60px 20px;
}

.section-title {
    margin-bottom: 25px;
}

.section-title h2 {
    font-size: 34px;
}

.section-title p {
    color: #788292;
    margin-top: 7px;
}

.products {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
}

/* ================= CARD ================= */

.card {
    min-width: 0;

    background: linear-gradient(
        145deg,
        #171c25,
        #11151c
    );

    border: 1px solid #292f3a;

    border-radius: 20px;

    padding: 16px;

    transition:
        transform .25s,
        border-color .25s;
}

.card:hover {
    transform: translateY(-5px);
    border-color: #424b5b;
}

.product-image {
    width: 100%;
    height: 205px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 16px;

    background: #1d2330;

    margin-bottom: 18px;
}

.product-image img {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;
}

/*
   Если картинка не загрузилась,
   JS полностью уберёт img.
   Эмодзи здесь НЕТ.
*/

.product-image.image-error {
    background:
        linear-gradient(
            145deg,
            #1b202a,
            #161b23
        );
}

.card h3 {
    font-size: 18px;
    margin-bottom: 7px;
}

.description {
    color: #7d8796;

    font-size: 13px;

    line-height: 1.5;

    min-height: 40px;
}

.bottom {
    min-height: 43px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 10px;

    margin-top: 18px;
}

.price {
    flex-shrink: 0;

    font-size: 19px;
    font-weight: 900;
}

/* ================= ADD BUTTON ================= */

.add {
    border: none;

    padding: 11px 15px;

    border-radius: 11px;

    background: #7168ff;

    color: white;

    font-size: 13px;
    font-weight: 900;

    cursor: pointer;

    transition: .2s;
}

.add:hover {
    background: #8179ff;
    transform: translateY(-2px);
}

/* ================= CARD COUNTER ================= */

.card-counter {
    display: none;

    align-items: center;

    gap: 5px;

    padding: 4px;

    background: #202633;

    border: 1px solid #303747;

    border-radius: 11px;

    flex-shrink: 0;
}

.card-counter.active {
    display: flex;
}

.card-counter button {
    width: 32px;
    height: 32px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;

    border-radius: 8px;

    background: #7168ff;

    color: #fff;

    font-size: 19px;
    font-weight: 900;

    cursor: pointer;

    transition: .15s;
}

.card-counter button:hover {
    background: #847dff;
}

.card-counter input {
    width: 42px;
    height: 32px;

    border: none;
    outline: none;

    background: transparent;

    color: #ffffff !important;

    text-align: center;

    font-size: 15px;
    font-weight: 900;

    -moz-appearance: textfield;
}

.card-counter input::-webkit-inner-spin-button,
.card-counter input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

/* ================= OVERLAY ================= */

.overlay {
    position: fixed;
    inset: 0;

    z-index: 150;

    background: rgba(0,0,0,.7);

    opacity: 0;
    visibility: hidden;

    transition: .3s;
}

.overlay.active {
    opacity: 1;
    visibility: visible;
}

/* ================= CART ================= */

.cart {
    position: fixed;
    overflow: hidden;

    right: -500px;
    top: 0;

    width: min(500px, 100vw);
    max-width: 100vw;
    height: 100vh;

    z-index: 200;

    display: flex;
    flex-direction: column;

    background: #11151d;

    border-left: 1px solid #292f3a;

    box-shadow: -20px 0 60px rgba(0,0,0,.35);

    transition: right .4s cubic-bezier(.22,1,.36,1);
}

.cart.active {
    right: 0;
}

/* ================= CART HEADER ================= */

.cart-header {
    height: 72px;

    flex-shrink: 0;

    padding: 0 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    border-bottom: 1px solid #282e39;
}

.cart-header h2 {
    font-size: 21px;
}

.close {
    width: 38px;
    height: 38px;

    border: none;

    border-radius: 50%;

    background: #222833;

    color: white;

    font-size: 24px;

    cursor: pointer;

    transition: .2s;
}

.close:hover {
    background: #303744;
}

/* ================= CART ITEMS ================= */

.cart-items {
    flex: 1;
    min-width: 0;

    overflow-y: auto;
    overflow-x: hidden;

    padding: 15px;
}

.cart-item {
    display: grid;
    min-width: 0;

    grid-template-columns: 64px minmax(0, 1fr) 30px;

    align-items: center;

    gap: 12px;

    padding: 11px;

    margin-bottom: 10px;

    background: #181d26;

    border: 1px solid #2b323e;

    border-radius: 14px;

    animation: cartIn .28s ease;
}

@keyframes cartIn {
    from {
        opacity: 0;
        transform: translateX(25px);
    }

    to {
        opacity: 1;
        transform: translateX(0);
    }
}

/* ================= CART IMAGE ================= */

.cart-image {
    width: 64px;
    height: 64px;

    display: flex;
    align-items: center;
    justify-content: center;

    overflow: hidden;

    border-radius: 12px;

    background: #202633;
}

.cart-image img {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
}

/* ================= CART INFO ================= */

.cart-info {
    min-width: 0;
    overflow: hidden;
}

.cart-name {
    overflow: hidden;

    white-space: nowrap;
    text-overflow: ellipsis;

    font-size: 14px;
    font-weight: 900;

    margin-bottom: 5px;
}

.cart-price {
    color: #8993a3;

    font-size: 12px;
}

/* ================= CART COUNTER ================= */

.cart-controls {
    display: flex;
    align-items: center;

    gap: 5px;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;

    margin-top: 9px;
}

.cart-controls button {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;

    border-radius: 7px;

    background: #2a303c;

    color: white;

    font-size: 18px;
    font-weight: 900;

    cursor: pointer;

    transition: .15s;
}

.cart-controls button:hover {
    background: #7168ff;
}

.cart-controls input {
    width: 45px;
    height: 30px;

    border: 1px solid #394150;

    border-radius: 7px;

    background: #0e1218;

    color: #fff !important;

    outline: none;

    text-align: center;

    font-size: 14px;
    font-weight: 900;

    -moz-appearance: textfield;
}

.cart-controls input::-webkit-inner-spin-button,
.cart-controls input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
}

/* ВАЖНО: явное количество */

.quantity-label {
    margin-left: 6px;

    color: #9aa3b2;

    font-size: 12px;
    font-weight: 700;

    white-space: nowrap;
}

/* ================= DELETE ================= */

.delete {
    width: 30px;
    height: 30px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: none;

    background: transparent;

    color: #707a8a;

    font-size: 15px;

    cursor: pointer;

    border-radius: 7px;

    transition: .15s;
}

.delete:hover {
    background: #302026;
    color: #ff6972;
}

/* ================= EMPTY ================= */

.empty {
    text-align: center;

    color: #788292;

    padding-top: 80px;
}

.empty-icon {
    font-size: 48px;

    margin-bottom: 15px;

    opacity: .7;
}

.empty small {
    display: block;

    margin-top: 8px;

    color: #555f70;
}

/* ================= CART FOOTER ================= */

.cart-footer {
    flex-shrink: 0;
    position: relative;
    z-index: 2;

    padding: 18px 20px 20px;

    border-top: none;

    background: #11151d;
}

.total {
    display: flex;

    align-items: center;
    justify-content: space-between;

    margin-bottom: 15px;

    font-size: 20px;
    font-weight: 900;
}

.total-value {
    color: #9d98ff;

    transition: transform .25s;
}

.total-value.animate {
    transform: scale(1.08);
}

.clear {
    width: 100%;

    padding: 11px;

    border: 1px solid #303744;

    border-radius: 10px;

    background: #191e27;

    color: #929baa;

    cursor: pointer;

    margin-bottom: 9px;
}

.clear:hover {
    background: #202631;
}

.order-button {
    width: 100%;

    padding: 14px;

    border: none;

    border-radius: 11px;

    background: #7168ff;

    color: white;

    cursor: pointer;

    font-weight: 900;

    transition: .2s;
}

.order-button:hover {
    background: #817aff;
}

/* ================= FORM ================= */

.order-section {
    max-width: 760px;

    margin: 0 auto 70px;

    padding: 32px;

    background: #151a23;

    border: 1px solid #292f3b;

    border-radius: 22px;
}

.order-section h2 {
    font-size: 26px;
}

.subtitle {
    color: #818b9b;

    font-size: 13px;

    margin-top: 7px;
}

.form-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 0 14px;
}

.full {
    grid-column: 1 / -1;
}

label {
    display: block;

    margin: 16px 0 7px;

    font-size: 13px;
    font-weight: 800;
}

input,
textarea,
select {
    width: 100%;

    padding: 13px;

    border: 1px solid #303745;

    border-radius: 10px;

    outline: none;

    background: #0e1219;

    color: white;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #7168ff;
}

textarea {
    min-height: 100px;
    resize: vertical;
}

.delivery-title {
    margin-top: 18px;

    font-size: 13px;
    font-weight: 900;
}

.delivery {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 10px;

    margin-top: 8px;
}

.delivery div {
    position: relative;
}

.delivery label {
    margin: 0;

    padding: 15px;

    border: 1px solid #303745;

    border-radius: 11px;

    cursor: pointer;

    background: #0e1219;

    transition: .2s;
}

.delivery input {
    position: absolute;
    opacity: 0;
    pointer-events: none;
}

.delivery input:checked + label {
    border-color: #7168ff;

    background: rgba(113,104,255,.1);
}

.submit {
    width: 100%;

    margin-top: 22px;

    padding: 15px;

    border: none;

    border-radius: 11px;

    background: #7168ff;

    color: white;

    font-weight: 900;

    cursor: pointer;
}

.submit:hover {
    background: #817aff;
}

.result {
    display: none;

    margin-top: 15px;

    padding: 15px;

    border: 1px solid #285340;

    border-radius: 11px;

    background: #101c18;

    color: #9ee2c4;

    line-height: 1.7;

    font-size: 13px;
}

/* ================= FOOTER ================= */

footer {
    text-align: center;

    padding: 30px;

    border-top: 1px solid #222833;

    color: #626c7b;

    font-size: 12px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:1050px) {

    .products {
        grid-template-columns: repeat(3,1fr);
    }

}

@media(max-width:760px) {

    .products {
        grid-template-columns: repeat(2,1fr);
    }

    .form-grid {
        grid-template-columns: 1fr;
    }

    .full {
        grid-column: auto;
    }

}

@media(max-width:520px) {

    .products {
        grid-template-columns: 1fr;
    }

    .delivery {
        grid-template-columns: 1fr;
    }

    .order-section {
        margin-left: 12px;
        margin-right: 12px;

        padding: 22px;
    }

    .hero h1 {
        font-size: 46px;
    }

    .bottom {
        align-items: center;
    }

    .card-counter button {
        width: 30px;
    }

    .card-counter input {
        width: 36px;
    }

}

/* ================= START / WELCOME ================= */
.welcome-page {
    position: relative;
    width: 100%;
    height: 100vh;
    min-height: 100vh;
    overflow: hidden;
    margin-top: -72px;
    background: #000;
    z-index: 300;
}

.welcome-page img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

/* Прозрачная зона поверх кнопки на исходной картинке. */
.welcome-catalog-hitbox {
    position: absolute;
    left: 36.3%;
    bottom: 7.5%;
    width: 27.8%;
    height: 15.5%;
    border: 0;
    padding: 0;
    margin: 0;
    background: transparent;
    cursor: pointer;
    z-index: 2;
}

.welcome-catalog-hitbox:focus-visible {
    outline: 3px solid #fff;
    outline-offset: 4px;
    border-radius: 20px;
}

body.welcome-locked {
    overflow: hidden;
    height: 100vh;
}

@media (max-width: 700px) {
    .welcome-catalog-hitbox {
        left: 31%;
        width: 38%;
        bottom: 6%;
        height: 17%;
    }
}


/* =====================================================
   DRINKY — BANNER COLOR THEME
   Only visual styles are changed here.
===================================================== */

:root {
    --bg-main: #05030b;
    --bg-panel: #0c0916;
    --bg-panel-2: #120d20;
    --bg-card: #110b1d;
    --bg-input: #080610;
    --border: rgba(185, 80, 255, .28);
    --border-strong: rgba(255, 35, 220, .58);
    --pink: #ff19dc;
    --pink-2: #ff4cf0;
    --violet: #7c32ff;
    --purple: #a844ff;
    --cyan: #18dfff;
    --blue: #168bff;
    --text: #f9f5ff;
    --muted: #a79db8;
    --muted-2: #70657f;
}

html {
    background: var(--bg-main);
}

body {
    background:
        radial-gradient(circle at 12% 8%, rgba(124,50,255,.16), transparent 26%),
        radial-gradient(circle at 88% 18%, rgba(24,223,255,.10), transparent 22%),
        radial-gradient(circle at 50% 90%, rgba(255,25,220,.08), transparent 30%),
        var(--bg-main);
    color: var(--text);
}

header {
    background: rgba(5, 3, 11, .86);
    border-bottom: 1px solid rgba(168,68,255,.28);
    box-shadow: 0 8px 30px rgba(0,0,0,.35), 0 0 26px rgba(124,50,255,.08);
}

.logo {
    text-shadow: 0 0 16px rgba(255,25,220,.28);
}

.logo span {
    color: var(--pink);
}

.cart-button {
    border-color: rgba(24,223,255,.28);
    background: linear-gradient(135deg, rgba(124,50,255,.16), rgba(255,25,220,.10));
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.02), 0 0 18px rgba(124,50,255,.08);
}

.cart-button:hover {
    background: linear-gradient(135deg, rgba(124,50,255,.24), rgba(255,25,220,.16));
}

.cart-count {
    background: linear-gradient(135deg, var(--pink), var(--violet));
    box-shadow: 0 0 15px rgba(255,25,220,.35);
}

.hero {
    background:
        radial-gradient(circle at 18% 28%, rgba(168,68,255,.23), transparent 30%),
        radial-gradient(circle at 82% 72%, rgba(24,223,255,.10), transparent 28%),
        radial-gradient(circle at 50% 48%, rgba(255,25,220,.07), transparent 34%);
}

.hero h1 {
    background: linear-gradient(135deg, #ffffff 5%, #ff7cf4 48%, #8fdcff 100%);
    -webkit-background-clip: text;
    background-clip: text;
}

.hero p,
.section-title p,
.description,
.subtitle {
    color: var(--muted);
}

.section-title h2 {
    text-shadow: 0 0 14px rgba(168,68,255,.18);
}

.products {
    gap: 22px;
}

.card {
    background:
        linear-gradient(145deg, rgba(27,16,44,.96), rgba(9,7,15,.98));
    border-color: rgba(168,68,255,.25);
    box-shadow:
        0 10px 30px rgba(0,0,0,.28),
        inset 0 0 30px rgba(124,50,255,.035);
}

.card:hover {
    border-color: rgba(255,25,220,.58);
    box-shadow:
        0 14px 35px rgba(0,0,0,.35),
        0 0 28px rgba(255,25,220,.10);
}

.product-image {
    background:
        radial-gradient(circle at 50% 45%, rgba(24,223,255,.10), transparent 45%),
        linear-gradient(145deg, #171027, #090711);
    border: 1px solid rgba(24,223,255,.08);
}

.price {
    color: #fff;
    text-shadow: 0 0 12px rgba(255,25,220,.15);
}

.add,
.order-button,
.submit {
    background: linear-gradient(135deg, var(--pink), var(--violet));
    box-shadow:
        0 0 0 1px rgba(255,255,255,.05) inset,
        0 6px 20px rgba(255,25,220,.18);
}

.add:hover,
.order-button:hover,
.submit:hover {
    background: linear-gradient(135deg, #ff42e6, #965cff);
    box-shadow:
        0 0 0 1px rgba(255,255,255,.06) inset,
        0 8px 24px rgba(255,25,220,.28);
}

.card-counter {
    background: #130e20;
    border-color: rgba(168,68,255,.32);
}

.card-counter button,
.cart-controls button {
    background: linear-gradient(135deg, var(--violet), var(--pink));
}

.card-counter button:hover,
.cart-controls button:hover {
    background: linear-gradient(135deg, #9b55ff, #ff3de5);
}

.overlay {
    background: rgba(0,0,0,.78);
}

.cart {
    background:
        radial-gradient(circle at 20% 0%, rgba(124,50,255,.11), transparent 30%),
        #090711;
    border-left-color: rgba(168,68,255,.28);
    box-shadow: -20px 0 60px rgba(0,0,0,.55), -2px 0 20px rgba(124,50,255,.08);
}

.cart-header,
.cart-footer {
    border-color: rgba(168,68,255,.22);
    background: rgba(9,7,17,.96);
}

.close {
    background: #171025;
    border: 1px solid rgba(168,68,255,.2);
}

.close:hover {
    background: #211436;
}

.cart-item {
    background: linear-gradient(145deg, rgba(24,14,39,.95), rgba(10,8,17,.98));
    border-color: rgba(168,68,255,.20);
}

.cart-item:hover {
    border-color: rgba(24,223,255,.26);
}

.cart-image {
    background:
        radial-gradient(circle at 50% 50%, rgba(24,223,255,.08), transparent 55%),
        #130d20;
}

.cart-price,
.quantity-label {
    color: var(--muted);
}

.cart-controls input,
.card-counter input,
input,
textarea,
select {
    background: var(--bg-input);
    border-color: rgba(168,68,255,.22);
    color: #fff !important;
}

.cart-controls input:focus,
.card-counter input:focus,
input:focus,
textarea:focus,
select:focus {
    border-color: var(--pink);
    box-shadow: 0 0 0 3px rgba(255,25,220,.08);
}

.clear {
    border-color: rgba(24,223,255,.20);

/* Keep the welcome banner visually unchanged; only the site below it is themed. */


/* =====================================================
   SEAMLESS BACKGROUND — MATCH THE BANNER
===================================================== */

/* The banner has a deep black edge, so the page starts and
   continues with the same black instead of a visible strip. */
html,
body {
    background: #000 !important;
}

body {
    background:
        radial-gradient(ellipse at 50% 8%, rgba(124, 50, 255, .09), transparent 30%),
        radial-gradient(ellipse at 50% 72%, rgba(255, 25, 220, .055), transparent 34%),
        #000 !important;
}

/* Keep the transition from the welcome image into the menu seamless. */
#menu-page {
    background:
        radial-gradient(ellipse at 50% 0%, rgba(124, 50, 255, .08), transparent 28%),
        linear-gradient(to bottom, #000 0%, #020006 45%, #030007 100%);
}

/* Main sections sit on the same deep-space base without a grey band. */
.hero,
.container,
.order-section,
footer {
    background-color: transparent !important;
}

/* A very subtle neon atmosphere behind the catalog. */
.hero {
    background:
        radial-gradient(circle at 20% 30%, rgba(124,50,255,.15), transparent 28%),
        radial-gradient(circle at 80% 60%, rgba(24,223,255,.07), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(255,25,220,.06), transparent 30%) !important;
}

/* Remove the visual seam under the fixed header. */
header {
    background: rgba(0,0,0,.88) !important;
    border-bottom-color: rgba(168,68,255,.18) !important;
}

/* Footer fades into the same black as the banner. */
footer {
    background: linear-gradient(to bottom, rgba(0,0,0,.05), #000) !important;
}


/* =====================================================
   HEADER — ALWAYS VISIBLE
===================================================== */

header {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    width: 100% !important;
    height: 72px !important;
    z-index: 99999 !important;
    display: flex !important;
    visibility: visible !important;
    opacity: 1 !important;
    transform: none !important;
}

/* Keep the header above the welcome image as well. */
.welcome-page {
    z-index: 1;
}

header,
header * {
    pointer-events: auto;
}


/* =====================================================
   LOWER CATALOG CONTENT BY 3 CM
===================================================== */
#menu-page > main.container,
#menu-page > .order-section,
#menu-page > footer {
    transform: translateY(30px);
}

/* Keep the original flow height so the next sections remain aligned. */
#menu-page > main.container {
    margin-bottom: 30px;
}


/* =====================================================
   BANNER — FIT TO FULL WIDTH, NO SIDE CROPPING
===================================================== */

/* The source banner is 1774×887, so its whole width is
   always visible and its original aspect ratio is preserved. */
.welcome-page {
    width: 100vw !important;
    height: auto !important;
    min-height: 0 !important;
    overflow: visible !important;
    margin-top: -72px !important;
    background: #000 !important;
}

.welcome-page img {
    display: block !important;
    width: 100% !important;
    height: auto !important;
    max-width: 100% !important;
    object-fit: contain !important;
    object-position: center top !important;
}

/* The clickable area stays proportional to the banner. */
.welcome-catalog-hitbox {
    left: 36.3% !important;
    bottom: 7.5% !important;
    width: 27.8% !important;
    height: 15.5% !important;
}

/* On narrow screens the banner still scales by width instead of cropping. */
@media (max-width: 700px) {
    .welcome-catalog-hitbox {
        left: 31% !important;
        width: 38% !important;
        bottom: 6% !important;
        height: 17% !important;
    }
}


/* =====================================================
   ЕДИНЫЙ ФОН СТРАНИЦЫ — КАК У «ПОПУЛЯРНОЕ»
===================================================== */

:root {
    --popular-bg:
        radial-gradient(
            circle at 20% 30%,
            rgba(113,104,255,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(113,104,255,.12),
            transparent 32%
        );
}

/* Один фон на всём сайте. */
html,
body,
#menu-page {
    background: #0a0d12 !important;
    background-image: var(--popular-bg) !important;
    background-repeat: no-repeat !important;
    background-size: 100% 100% !important;
    background-attachment: scroll !important;
}

/* Все основные блоки становятся прозрачными,
   чтобы просвечивал тот же фон, что и у «Популярное». */
#menu-page > .hero,
#menu-page > .container,
#menu-page > .order-section,
#menu-page > footer {
    background-color: transparent !important;
    background-image: none !important;
}

/* Сам фон распространяется и за пределы первой секции. */
#menu-page::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    pointer-events: none;
    background: var(--popular-bg);
}

/* Шапка не создаёт отдельную цветную полосу. */
header {
    background: rgba(10,13,18,.82) !important;
    border-bottom-color: rgba(113,104,255,.22) !important;
}

/* Возвращаем одинаковую атмосферу именно блоку «Популярное». */
#menu-page > .hero {
    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(113,104,255,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(113,104,255,.12),
            transparent 32%
        ) !important;
}


/* =====================================================
   БАННЕР → САЙТ: МАКСИМАЛЬНО ПЛАВНЫЙ ПЕРЕХОД
===================================================== */

/* Убираем чёткую границу между баннером и меню. */
.welcome-page {
    position: relative;
    isolation: isolate;
}

.welcome-page::after {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    bottom: -1px;
    height: 220px;
    z-index: 3;
    pointer-events: none;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0%,
        rgba(0,0,0,.10) 18%,
        rgba(10,13,18,.28) 40%,
        rgba(10,13,18,.62) 68%,
        #0a0d12 100%
    );
}

/* Сам баннер не меняем: поверх него только мягкая вуаль у нижнего края. */
.welcome-page img {
    position: relative;
    z-index: 1;
}

/* Меню начинается сразу под баннером, без отдельной цветной полосы. */
#menu-page {
    position: relative;
    margin-top: 0 !important;
    padding-top: 0 !important;
    background:
        radial-gradient(
            ellipse at 20% 0%,
            rgba(113,104,255,.22),
            transparent 30%
        ),
        radial-gradient(
            ellipse at 80% 0%,
            rgba(113,104,255,.12),
            transparent 30%
        ),
        linear-gradient(
            to bottom,
            #0a0d12 0%,
            #0a0d12 100%
        ) !important;
}

/* Дополнительное свечение "подтягивает" фон вверх под нижнюю часть баннера. */
#menu-page::before {
    content: "";
    position: absolute;
    left: 0;
    right: 0;
    top: -120px;
    height: 260px;
    z-index: 0;
    pointer-events: none;
    background:
        radial-gradient(
            ellipse at 20% 50%,
            rgba(113,104,255,.18),
            transparent 38%
        ),
        radial-gradient(
            ellipse at 80% 50%,
            rgba(113,104,255,.08),
            transparent 38%
        );
}

/* Весь контент меню остаётся поверх перехода. */
#menu-page > * {
    position: relative;
    z-index: 1;
}

/* Первый блок после баннера получает мягкое продолжение цвета. */
#menu-page > .hero {
    background:
        radial-gradient(
            circle at 20% 30%,
            rgba(113,104,255,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(113,104,255,.12),
            transparent 32%
        ) !important;
}

</style>

<script>

/* =====================================================
   ТОВАРЫ

   В image вставляешь прямую ссылку на картинку.

   Например:

   image: "https://site.ru/cola.png"

   Если image = "" или ссылка сломана,
   никакого эмодзи не будет.
===================================================== */

const products = [

    {

        name: "GRAPE NEBULA",
        price: 12,
        image: "https://cdn.discordapp.com/attachments/1353657690546769951/1547713738537443460/grape_nebula_120x120_final.png?ex=6aa46c3e&is=6aa31abe&hm=3b6d890d4d4e40e180396ba39d414d3340f80192d5d57db67e77286465a2a06c&"

    },

    {

        name: "OCEAN BREEZE",
        price: 20,
        image: "https://cdn.discordapp.com/attachments/1353657690546769951/1547713739761909870/ocean_breeze_120x120_final.png?ex=6aa46c3e&is=6aa31abe&hm=d44b4e17201492eb52a08ca73e37edc834cbebc3f3c6ab78b8ab84a8757113a3&"
    },

    {
        id: "MINT MOON",
        name: "MINT MOON",
        price: 25,
        image: "https://cdn.discordapp.com/attachments/1353657690546769951/1547713740206776340/mint_meteor_moon_120x120_final.png?ex=6aa46c3e&is=6aa31abe&hm=4015472b36b3b192a660d46608a01865d3ae7484068d43ab89461fdcc983b4a7&"

        name: "LEMON CHAOS",
        price: 15,
        image: "https://cdn.discordapp.com/attachments/1353657690546769951/1547713740877860864/lemon_chaos_120x120_final.png?ex=6aa46c3e&is=6aa31abe&hm=062b9fcba34ec3a6b7a0f974ad93440ccf1190a3bd7e150f4fb540b84ca9b0dd&"

        name: "STRAWBERRY BUNNY",
        price: 15,
        image: "https://cdn.discordapp.com/attachments/1353657690546769951/1547713741284450455/strawberry_bunny_120x120_final.png?ex=6aa46c3f&is=6aa31abf&hm=4867470d8aa4f32936b0ab916927c74a3cc6ac4c1e2252370ec7d4c52c393a01&"
    }

];


/* =====================================================
   КОРЗИНА
===================================================== */

let cart = [];


/* =====================================================
   ЗАГРУЗКА
===================================================== */

// Корзина не сохраняется после обновления страницы.
cart = [];


/* =====================================================
   СОХРАНЕНИЕ
===================================================== */

function saveCart() {
    // Сохранение отключено: после обновления страницы корзина очищается.
}


/* =====================================================
   ТОВАР
===================================================== */

function findProduct(id) {

    return products.find(
        product =>
            product.id === id
    );

}


/* =====================================================
   КОЛИЧЕСТВО
===================================================== */

function getQuantity(id) {

    const item =
        cart.find(
            item =>
                item.id === id
        );

    return item
        ? Number(item.quantity)
        : 0;

}


/* =====================================================
   ДОБАВИТЬ ТОВАР
===================================================== */

function addToCart(id) {

    const product =
        findProduct(id);

    if (!product) {
        return;
    }


    const existing =
        cart.find(
            item =>
                item.id === id
        );


    if (existing) {

        existing.quantity =
            Number(existing.quantity) + 1;

    } else {

        cart.push({

            id: product.id,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: 1

        });

    }


    saveCart();

    updateEverything();

}


/* =====================================================
   + / -
===================================================== */

function changeQuantity(
    id,
    amount
) {

    const item =
        cart.find(
            item =>
                item.id === id
        );

    if (!item) {
        return;
    }


    item.quantity =
        Number(item.quantity) + amount;


    if (item.quantity <= 0) {

        cart =
            cart.filter(
                item =>
                    item.id !== id
            );

    }


    saveCart();

    updateEverything();

}


/* =====================================================
   ВВОД КОЛИЧЕСТВА НА КАРТОЧКЕ
===================================================== */

function setProductQuantity(
    id,
    value
) {

    let quantity =
        parseInt(value, 10);


    if (
        isNaN(quantity) ||
        quantity < 0
    ) {

        quantity = 0;

    }


    const product =
        findProduct(id);

    if (!product) {
        return;
    }


    const existing =
        cart.find(
            item =>
                item.id === id
        );


    if (quantity === 0) {

        cart =
            cart.filter(
                item =>
                    item.id !== id
            );

    }

    else if (existing) {

        existing.quantity =
            quantity;

    }

    else {

        cart.push({

            id: product.id,

            name: product.name,

            price: product.price,

            image: product.image,

            quantity: quantity

        });

    }


    saveCart();

    updateEverything();

}


/* =====================================================
   ВВОД КОЛИЧЕСТВА В КОРЗИНЕ
===================================================== */

function setCartQuantity(
    id,
    value
) {

    let quantity =
        parseInt(value, 10);


    if (
        isNaN(quantity) ||
        quantity <= 0
    ) {

        removeFromCart(id);

        return;

    }


    const item =
        cart.find(
            item =>
                item.id === id
        );

    if (!item) {
        return;
    }


    item.quantity =
        quantity;


    saveCart();

    updateEverything();

}


/* =====================================================
   УДАЛИТЬ
===================================================== */

function removeFromCart(id) {

    cart =
        cart.filter(
            item =>
                item.id !== id
        );


    saveCart();

    updateEverything();

}


/* =====================================================
   ОЧИСТИТЬ
===================================================== */

function clearCart() {

    cart = [];

    saveCart();

    updateEverything();

}


/* =====================================================
   РЕНДЕР КАРТОЧЕК
===================================================== */

function renderProducts() {

    const container =
        document.getElementById("products");


    container.innerHTML =
        products.map(product => {

            const quantity =
                getQuantity(product.id);


            return `

                <div class="card">

                    <div
                        class="product-image"
                        id="image-box-${product.id}">

                        ${
                            product.image
                            ?
                            `
                            <img
                                src="${product.image}"
                                alt="${product.name}"
                                onerror="
                                    imageError(
                                        '${product.id}'
                                    )
                                ">
                            `
                            :
                            ``
                        }

                    </div>


                    <h3>
                        ${product.name}
                    </h3>


                    <p class="description">

                        ${
                            product.id === "GRAPE NEBULA"
                            ? "Виноград."
                            : product.id === "COTTON DREAM"
                            ? "Сладкая сахарная вата с мягкими ягодными нотами."
                            : product.id === "MINT CIRCUIT"
                            ? "Яблоко и мята."
                            : product.id === "OCEAN BREEZE"
                            ? "Кокос и мята."
                            : product.id === "MINT MOON"
                            ? "Мята с мягкими сладкими нотами."
                            : product.id === "KIWI METEOR"
                            ? "Киви."
                            : product.id === "LEMON CHAOS"
                            ? "Лимон."
                            : "Клубника."

                        }

                    </p>


                    <div class="bottom">


                        <div class="price">
                            ${product.price} $
                        </div>


                        <!-- КНОПКА -->

                        <button
                            class="add"
                            id="add-${product.id}"
                            style="
                                display:
                                ${quantity > 0
                                    ? "none"
                                    : "block"}
                            "
                            onclick="
                                addToCart(
                                    '${product.id}'
                                )
                            ">

                            + Добавить

                        </button>


                        <!-- СЧЁТЧИК -->

                        <div
                            class="
                                card-counter
                                ${quantity > 0
                                    ? "active"
                                    : ""}
                            "
                            id="
                                counter-${product.id}
                            ">


                            <button
                                type="button"
                                onclick="
                                    changeQuantity(
                                        '${product.id}',
                                        -1
                                    )
                                ">

                                −

                            </button>


                            <input
                                type="number"
                                min="0"
                                value="${quantity}"
                                aria-label="Количество"
                                onchange="
                                    setProductQuantity(
                                        '${product.id}',
                                        this.value
                                    )
                                "
                                onkeydown="
                                    if(event.key === 'Enter') {
                                        this.blur();
                                    }
                                "
                            >


                            <button
                                type="button"
                                onclick="
                                    changeQuantity(
                                        '${product.id}',
                                        1
                                    )
                                ">

                                +

                            </button>


                        </div>


                    </div>

                </div>

            `;

        }).join("");

}

/* =====================================================

===================================================== */

function updateCartCount() {

    const count =
        cart.reduce(
            (sum, item) =>
                sum +
                Number(item.quantity),

            0
        );


    document.getElementById(
        "cartCount"
    ).textContent = count;

}


/* =====================================================
   ИТОГОВАЯ СУММА
===================================================== */

let oldTotal = 0;


function updateTotal() {

    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                Number(item.price) *
                Number(item.quantity),

            0
        );


    const element =
        document.getElementById(
            "total"
        );


    const start =
        oldTotal;


    const difference =
        total - start;


    const duration =
        300;


    const startTime =
        performance.now();


    function animate(time) {

        const progress =
            Math.min(
                (time - startTime) /
                duration,
                1
            );


        const value =
            Math.round(
                start +
                difference *
                progress
            );


        element.textContent =
            value + " $";


        if (progress < 1) {

            requestAnimationFrame(
                animate
            );

        }

    }


    requestAnimationFrame(
        animate
    );


    element.classList.remove(
        "animate"
    );


    void element.offsetWidth;


    element.classList.add(
        "animate"
    );


    oldTotal = total;

}

   ОБНОВИТЬ ВСЁ
===================================================== */

function updateEverything() {

    renderProducts();

    renderCart();

    updateCartCount();

    updateTotal();

    document
        .getElementById("cart")
        .classList.remove("active");

        .getElementById("overlay")
        .classList.remove("active");

/* =====================================================
   ЗАЩИТА ТЕКСТА
===================================================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
